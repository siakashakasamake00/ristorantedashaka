<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>QR Code tavoli · Da Shaka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  color-scheme: light;
  --sea-950:#062536; --sea-900:#0a3550; --sea-700:#13587a; --sea-200:#b9d7e4; --sea-50:#eef6f9;
  --coral:#ef6f4f; --coral-700:#b9442a; --bg:#f1f5f7; --ink:#0c1f2b; --muted:#6b8190; --line:#dfe7eb; --soft:#eef3f5;
  --display:"Fraunces", Georgia, serif; --body:"Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button,a.b{font:inherit;border:0;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
header{background:var(--sea-950);color:#fff}
.hin{max-width:1200px;margin:0 auto;padding:18px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.hin small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.18em;color:var(--sea-200)}
.hin h1{margin:0;font-family:var(--display);font-size:26px;letter-spacing:.08em}
.hin .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.hb{height:42px;padding:0 16px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:22px 16px 40px}
h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.sub{margin:0 0 16px;color:var(--muted)}
.warn{background:#fff8eb;border:1px solid #fde2b3;color:#8a4b08;border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.card h3{margin:0;font-size:17px;font-weight:800;letter-spacing:.1em;text-align:center}
.qr{background:var(--soft);border-radius:14px;padding:14px;display:grid;place-items:center}
.qr img,.qr canvas{width:150px!important;height:150px!important;max-width:100%}
.link{font-size:12px;color:var(--coral-700);text-align:center;word-break:break-all;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.b{height:40px;border-radius:10px;font-weight:700;font-size:13px}
.b.dark{background:var(--sea-900);color:#fff}
.b.light{background:var(--soft);color:var(--ink)}
@media print{
  header,.row,.warn,.sub,.link{display:none!important}
  body{background:#fff}
  main{padding:0}
  .grid{grid-template-columns:repeat(3,1fr)}
  .card{break-inside:avoid;border:1px solid #ccc}
  .card h3::before{content:"DA SHAKA · ";}
}
</style>
</head>
<body>
<header>
  <div class="hin">
    <div><small>AMMINISTRAZIONE</small><h1 id="hName">DA SHAKA</h1></div>
    <div class="acts">
      <a class="b hb" href="cucina.html">Dashboard cucina</a>
      <a class="b hb" href="admin.html">Pannello titolare</a>
      <a class="b hb" href="index.html">Menu</a>
      <button class="hb" onclick="window.print()">Stampa tutti</button>
    </div>
  </div>
</header>
<main>
  <h2>QR Code tavoli (<span id="count">20</span>)</h2>
  <p class="sub">Ogni QR apre il menu con il numero del tavolo già impostato. Scarica il cartoncino PNG da stampare. Il numero di tavoli si cambia dal pannello del titolare.</p>
  <p class="warn" id="warn" hidden></p>
  <div class="grid" id="grid"></div>
</main>
<script>
(function(){
"use strict";
var TABLES = 20, NAME = "Da Shaka", TAG = "Ristorante di Pesce";
var base = location.origin && location.origin.startsWith("http") ? location.origin : "https://tuo-sito.netlify.app";
if (!location.origin.startsWith("https://") || /localhost|127\.0\.0\.1/.test(location.host)) {
  var w = document.getElementById("warn"); w.hidden = false;
  w.textContent = "Attenzione: stai aprendo questa pagina da " + (location.origin.startsWith("http") ? location.origin : "un file sul computer") + ". I QR puntano a questo indirizzo: aprila dal sito pubblicato su Netlify prima di stampare.";
}
var ASP = true;
function url(n){ return n ? base + "/?tavolo=" + n : base + "/?asporto=1"; }
function label(n){ return n ? "TAVOLO " + n : "ASPORTO"; }
var grid = document.getElementById("grid");
function draw(){
  grid.innerHTML = "";
  document.getElementById("count").textContent = TABLES;
  for (var n = 1; n <= TABLES; n++) {
    var c = document.createElement("article"); c.className = "card";
    if (!n) c.style.borderColor = "var(--coral)";
    c.innerHTML = "<h3>" + label(n) + '</h3><div class="qr" id="qr' + n + '"></div><a class="link" href="' + url(n) + '" target="_blank" rel="noopener">' + url(n).replace(/^https?:\/\//, "") + '</a><div class="row"><button class="b dark" data-png="' + n + '">Scarica PNG</button><button class="b light" data-copy="' + n + '">Copia link</button></div>';
    grid.appendChild(c);
    if (window.QRCode) new QRCode(c.querySelector(".qr"), { text: url(n), width: 600, height: 600, colorDark: "#062536", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
  }
}
draw();
// numero di tavoli e nome aggiornati dal pannello del titolare
if (location.protocol.startsWith("http")) {
  fetch("/api/menu", { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
    var R = j && j.data && j.data.restaurant; if (!R) return;
    var changed = (R.tables_count && R.tables_count !== TABLES);
    TABLES = R.tables_count || TABLES; NAME = R.name || NAME; TAG = R.tagline || "";
    document.getElementById("hName").textContent = NAME.toUpperCase();
    if (changed) draw();
  }).catch(function(){});
}
grid.addEventListener("click", async function(e){
  var b = e.target.closest("button"); if (!b) return;
  if (b.dataset.copy) {
    try { await navigator.clipboard.writeText(url(+b.dataset.copy)); b.textContent = "Copiato ✓"; } catch (err) { prompt("Copia il link:", url(+b.dataset.copy)); }
    setTimeout(function(){ b.textContent = "Copia link"; }, 1500);
  }
  if (b.dataset.png) card(+b.dataset.png);
});
function fitText(x, t, cx, y, size, max, font){ do { x.font = font.replace("{s}", size); size -= 4; } while (x.measureText(t).width > max && size > 30); x.fillText(t, cx, y); }
// cartoncino da stampare: nome, QR, numero del tavolo
function card(n){
  var src = document.querySelector("#qr" + n + " canvas"); if (!src) return;
  var W = 1000, H = 1300, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  var x = cv.getContext("2d");
  x.fillStyle = "#ffffff"; x.fillRect(0, 0, W, H);
  x.fillStyle = "#062536"; x.fillRect(0, 0, W, 230);
  x.textAlign = "center"; x.fillStyle = "#ffffff";
  x.font = "700 92px Fraunces, Georgia, serif"; fitText(x, NAME.toUpperCase(), W / 2, 130, 92, W - 80, "700 {s}px Fraunces, Georgia, serif");
  x.fillStyle = "#ffc9b8"; x.font = "600 34px Manrope, system-ui, sans-serif"; x.fillText(TAG, W / 2, 190);
  x.drawImage(src, 180, 300, 640, 640);
  x.fillStyle = "#062536"; x.font = "800 118px Manrope, system-ui, sans-serif"; x.fillText(label(n), W / 2, 1100);
  x.fillStyle = "#6b8190"; x.font = "500 32px Manrope, system-ui, sans-serif"; x.fillText(n ? "Inquadra il QR: menu, foto e Marina, la cameriera virtuale" : "Inquadra il QR: ordina online e ritira al locale", W / 2, 1180);
  var a = document.createElement("a"); a.href = cv.toDataURL("image/png"); a.download = "da-shaka-" + (n ? "tavolo-" + n : "asporto") + ".png"; a.click();
}
})();
</script>
</body>
</html>
